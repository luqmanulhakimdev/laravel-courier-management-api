<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Courier Management API - Swagger UI</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css" />
  <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5.18.2/favicon-32x32.png" sizes="32x32" />
  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .top-bar-custom {
      background: #0f172a;
      color: #f8fafc;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
    }
    .top-bar-custom a {
      color: #38bdf8;
      text-decoration: none;
      margin-left: 18px;
      font-weight: 500;
      transition: color 0.15s ease-in-out;
    }
    .top-bar-custom a:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }
    .swagger-ui .topbar { display: none; }
  </style>
</head>
<body>
  <div class="top-bar-custom">
    <div>
      <strong>Courier Management API</strong> &bull; Interactive Documentation
    </div>
    <div>
      <a href="/openapi.json" target="_blank" download="openapi.json">OpenAPI JSON</a>
      <a href="/openapi.yaml" target="_blank" download="openapi.yaml">OpenAPI YAML</a>
      <a href="/courier-management-api.postman_collection.json" target="_blank" download="courier-management-api.postman_collection.json">Postman Collection</a>
    </div>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        url: "/openapi.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout"
      });
    };
  </script>
</body>
</html>
